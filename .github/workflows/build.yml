name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build portable application
        shell: powershell
        run: .\Derle.ps1
      - name: Test protocol logic and render UI
        shell: powershell
        run: .\scripts\Test.ps1
      - name: Upload build and test outputs
        uses: actions/upload-artifact@v4
        with:
          name: air5-control-windows
          path: |
            Air5-Control.exe
            self-test.txt
            Onizleme.png
